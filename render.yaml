# Quantum Coffee ONLY. Import this blueprint only into Quantum Coffee's Render account.
# Requires explicit billing approval before creating the paid Starter web service.
services:
  - type: web
    name: quantum-coffee-api
    repo: https://github.com/quantumcoffee-eg/quantumcoffee
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: quantumcoffee_production
      - key: REGISTRATION_ENABLED
        value: 'false'
      - key: CHECKOUT_ENABLED
        value: 'false'
      - key: ORDER_EMAILS_ENABLED
        value: 'false'
      - key: ALLOW_ADMIN_BOOTSTRAP
        value: 'false'
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
